<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Una red conectada bajo el océano</title>
  <desc id="desc">Ilustración conceptual de tres estaciones costeras conectadas por una red de fibra óptica sobre el fondo marino. Pulsos de luz recorren el cable principal y una bifurcación, entre repetidores y nodos de conexión.</desc>
  <defs>
    <linearGradient id="surface" x1="310" y1="80" x2="540" y2="315" gradientUnits="userSpaceOnUse"><stop stop-color="#41c6c3" stop-opacity=".65"/><stop offset="1" stop-color="#2196ac" stop-opacity=".32"/></linearGradient>
    <linearGradient id="front" x1="380" y1="210" x2="330" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#1597ac" stop-opacity=".6"/><stop offset="1" stop-color="#092f4b" stop-opacity=".94"/></linearGradient>
    <linearGradient id="side" x1="810" y1="230" x2="610" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#198a9f" stop-opacity=".64"/><stop offset="1" stop-color="#06344d" stop-opacity=".96"/></linearGradient>
    <linearGradient id="land" x1="90" y1="130" x2="800" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#b6d9ce"/><stop offset="1" stop-color="#69b1b0"/></linearGradient>
    <linearGradient id="bed" x1="130" y1="300" x2="520" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#3a8d9b"/><stop offset="1" stop-color="#164d68"/></linearGradient>
    <linearGradient id="fiber" x1="150" y1="225" x2="750" y2="275" gradientUnits="userSpaceOnUse"><stop stop-color="#65e1d1"/><stop offset=".52" stop-color="#c1fff1"/><stop offset="1" stop-color="#58d7db"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#3ad4cc" stop-opacity=".22"/><stop offset="1" stop-color="#3ad4cc" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="light" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="route" d="M155 209 C164 225 174 242 190 262 C207 282 221 305 253 313 C303 324 324 328 371 341 C421 355 475 359 513 375 C542 387 568 393 591 381 C633 359 656 329 682 300 C702 278 729 256 754 244"/>
    <path id="branch" d="M446.5 357.25 C410 337 379 311 355 281 C330 250 315 214 324 185 C329 168 341 151 338 133"/>
    <clipPath id="frontClip"><path d="M70 170 575 320 575 455 70 305Z"/></clipPath>
  </defs>
  <style>
    .signal{stroke-dasharray:3 97;animation:transmit 7s linear infinite}
    .signal-delay{animation-delay:-3.5s}
    .signal-branch{animation-duration:8s;animation-delay:-2s}
    .beacon{transform-box:fill-box;transform-origin:center;animation:beacon 4.5s ease-out infinite}
    .beacon-delay{animation-delay:-2.25s}
    .beacon-third{animation-delay:-1.5s}
    .surface-shimmer{animation:shimmer 7s ease-in-out infinite alternate}
    @keyframes transmit{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @keyframes beacon{0%{opacity:.65;transform:scale(.7)}80%,100%{opacity:0;transform:scale(1.8)}}
    @keyframes shimmer{from{opacity:.28}to{opacity:.7}}
    @media(prefers-reduced-motion:reduce){.signal,.beacon,.surface-shimmer{animation:none}.signal{display:none}.beacon{opacity:.25}}
  </style>

                                                                               
